<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в АРХИВ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #79443B;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .login-box {
            background-color: white;
            border-radius: 30px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #79443B;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #79443B;
            font-size: 16px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #79443B;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #5a312b;
            box-shadow: 0 0 5px rgba(121, 68, 59, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #79443B;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #5a312b;
            transform: translateY(-2px);
        }

        .error-message {
            background-color: #ffe6e6;
            color: #d32f2f;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            border-left: 4px solid #d32f2f;
        }

        .error-message ul {
            margin: 0;
            padding-left: 20px;
            text-align: left;
        }

        .error-message li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>АРХИВ</h1>
            
            {% if form.errors %}
                <div class="error-message">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            {{ error }}
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username">Логин</label>
                    <input type="text" 
                           name="username" 
                           id="id_username" 
                           value="{{ form.username.value|default:'' }}" 
                           required
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password">Пароль</label>
                    <input type="password" 
                           name="password" 
                           id="id_password" 
                           required>
                </div>

                <button type="submit">Войти</button>
                <input type="hidden" name="next" value="{{ next|default:'/exhibits/' }}">
            </form>
        </div>
    </div>
</body>
</html>
